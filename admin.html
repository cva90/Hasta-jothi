<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Hasta Jothi</title>

    <link rel="stylesheet"
          href="css/admin.css">

</head>

<body class="admin-login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">

                <div class="logo-icon">🧘</div>

                <h1>Hasta Jothi</h1>

                <p>Meditation & Healing Centre</p>

            </div>


            <div class="login-heading">

                <h2>Admin Login</h2>

                <p>
                    Sign in to manage your bookings
                </p>

            </div>


            <form id="adminLoginForm">

                <div class="admin-form-group">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <div class="admin-form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div id="loginMessage"
                     class="login-message">
                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login to Dashboard
                </button>

            </form>


            <a href="index.html"
               class="back-home">

                ← Back to Website

            </a>

        </div>

    </div>


    <script src="js/admin.js"></script>

</body>

</html>
